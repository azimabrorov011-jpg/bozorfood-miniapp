<!doctype html>
<html lang="uz">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#f5f7fb"
  >

  <meta
    name="format-detection"
    content="telephone=no"
  >

  <title>BozorFood — Bozor ichida issiq ovqat</title>

  <!-- =====================================================
       TELEGRAM MINI APP
       Bu script BIRINCHI yuklanadi.
       ===================================================== -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <!-- =====================================================
       ASOSIY CSS
       ===================================================== -->
  <link rel="stylesheet" href="styles.css">

  <link rel="stylesheet" href="premium.css">


  <!-- =====================================================
       SUPABASE REALTIME
       ===================================================== -->
  <script src="realtime.js"></script>

</head>


<body>

  <!-- =====================================================
       APP
       ===================================================== -->

  <div class="app">


    <!-- ===================================================
         HEADER
         =================================================== -->

    <header class="topbar">

      <div>

        <div class="brand">
          🍽 BozorFood
        </div>

        <div class="subtitle">
          Bozor ichida issiq ovqat — joyingizgacha
        </div>

      </div>


      <div class="avatar">
        👤
      </div>

    </header>



    <!-- ===================================================
         MAIN
         =================================================== -->

    <main>


      <!-- =================================================
           LOCATION / SHOP
           ================================================= -->

      <section class="location-card">

        <div class="pin">
          📍
        </div>


        <div class="location-info">

          <div class="label">
            Sizning joyingiz
          </div>


          <div
            id="shopName"
            class="shop-name"
          >
            Aniqlanmoqda...
          </div>


          <div
            id="shopLocation"
            class="shop-location"
          >
            ...
          </div>

        </div>


        <div
          id="shopId"
          class="shop-id"
        >
          B001
        </div>

      </section>



      <!-- =================================================
           SEARCH
           ================================================= -->

      <div class="search">

        <span>
          🔎
        </span>


        <input
          id="searchInput"
          type="search"
          placeholder="Ovqat qidiring..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
        >

      </div>



      <!-- =================================================
           CATEGORIES
           ================================================= -->

      <div
        id="categories"
        class="categories"
      ></div>



      <!-- =================================================
           MENU
           ================================================= -->

      <section
        id="menu"
        class="menu"
      ></section>


    </main>



    <!-- ===================================================
         CART FLOATING BUTTON
         =================================================== -->

    <button
      id="cartButton"
      class="cart-button hidden"
      type="button"
    >

      <span>
        🛒 Savatcha
      </span>


      <span id="cartCount">
        0
      </span>


      <strong id="cartTotal">
        0 so'm
      </strong>

    </button>


  </div>



  <!-- =====================================================
       CART MODAL
       ===================================================== -->

  <div
    id="cartModal"
    class="modal hidden"
  >

    <div class="sheet">


      <!-- HEADER -->

      <div class="sheet-head">

        <h2>
          🛒 Savatcha
        </h2>


        <button
          id="closeCart"
          type="button"
          aria-label="Savatchani yopish"
        >
          ✕
        </button>

      </div>



      <!-- CART ITEMS -->

      <div
        id="cartItems"
      ></div>



      <!-- CHECKOUT -->

      <div class="checkout">


        <!-- TOTAL -->

        <div class="row">

          <span>
            Jami
          </span>


          <strong id="checkoutTotal">
            0 so'm
          </strong>

        </div>



        <!-- PHONE -->

        <input
          id="phone"
          type="tel"
          placeholder="Telefon raqam"
          inputmode="tel"
          autocomplete="tel"
        >



        <!-- NOTE -->

        <textarea
          id="note"
          placeholder="Izoh: masalan, 3-qator 47-do‘kon oldiga..."
          rows="3"
        ></textarea>



        <!-- ORDER -->

        <button
          id="orderButton"
          type="button"
        >
          Buyurtma berish
        </button>


      </div>


    </div>

  </div>



  <!-- =====================================================
       SUCCESS MODAL
       ===================================================== -->

  <div
    id="successModal"
    class="modal hidden"
  >

    <div class="sheet success">


      <div class="success-icon">
        ✅
      </div>


      <h2>
        Buyurtma qabul qilindi!
      </h2>


      <p id="orderNumber"></p>


      <p class="muted">
        Oshxona tayyorlaydi, kuryer esa aynan sizning
        joyingizga olib boradi.
      </p>


      <button
        id="doneButton"
        type="button"
      >
        Yopish
      </button>


    </div>

  </div>



  <!-- =====================================================
       JAVASCRIPT
       TARTIBI JUDA MUHIM
       =====================================================

       1. app.js
          Asosiy Mini App logikasi.

       2. secure-order.js
          Buyurtmani xavfsiz RPC orqali yuborish.

       3. premium.js
          Premium UX, Telegram haptic va WebApp.

       4. realtime.js
          Supabase Realtime event engine.

       ===================================================== -->


  <script src="app.js"></script>

  <script src="secure-order.js"></script>

  <script src="premium.js"></script>


</body>

</html>
