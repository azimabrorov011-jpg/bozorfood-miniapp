<!doctype html>
<html lang="uz">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >

  <title>BozorFood</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Asosiy dizayn -->
  <link rel="stylesheet" href="styles.css">

  <!-- Premium dizayn -->
  <link rel="stylesheet" href="premium.css">
</head>


<body>

<div class="app">

  <!-- HEADER -->
  <header class="topbar">

    <div>

      <div class="brand">
        🍽 BozorFood
      </div>

      <div class="subtitle">
        Bozor ichida issiq ovqat — joyingizgacha
      </div>

    </div>

    <div class="avatar">
      👤
    </div>

  </header>


  <main>

    <!-- LOCATION -->
    <section class="location-card">

      <div class="pin">
        📍
      </div>

      <div class="location-info">

        <div class="label">
          Sizning joyingiz
        </div>

        <div
          id="shopName"
          class="shop-name"
        >
          Aniqlanmoqda...
        </div>

        <div
          id="shopLocation"
          class="shop-location"
        >
          ...
        </div>

      </div>

      <div
        id="shopId"
        class="shop-id"
      >
        B001
      </div>

    </section>


    <!-- SEARCH -->
    <div class="search">

      <span>
        🔎
      </span>

      <input
        id="searchInput"
        type="search"
        placeholder="Ovqat qidiring..."
      >

    </div>


    <!-- CATEGORIES -->
    <div
      id="categories"
      class="categories"
    ></div>


    <!-- MENU -->
    <section
      id="menu"
      class="menu"
    ></section>

  </main>


  <!-- CART BUTTON -->
  <button
    id="cartButton"
    class="cart-button hidden"
  >

    <span>
      🛒 Savatcha
    </span>

    <span id="cartCount">
      0
    </span>

    <strong id="cartTotal">
      0 so'm
    </strong>

  </button>

</div>


<!-- CART MODAL -->
<div
  id="cartModal"
  class="modal hidden"
>

  <div class="sheet">

    <div class="sheet-head">

      <h2>
        🛒 Savatcha
      </h2>

      <button id="closeCart">
        ✕
      </button>

    </div>


    <div
      id="cartItems"
    ></div>


    <div class="checkout">

      <div class="row">

        <span>
          Jami
        </span>

        <strong id="checkoutTotal">
          0 so'm
        </strong>

      </div>


      <input
        id="phone"
        placeholder="Telefon raqam"
        inputmode="tel"
      >


      <textarea
        id="note"
        placeholder="Izoh: masalan, 3-qator 47-do‘kon oldiga..."
      ></textarea>


      <button
        id="orderButton"
      >
        Buyurtma berish
      </button>

    </div>

  </div>

</div>


<!-- SUCCESS MODAL -->
<div
  id="successModal"
  class="modal hidden"
>

  <div class="sheet success">

    <div class="success-icon">
      ✅
    </div>

    <h2>
      Buyurtma qabul qilindi!
    </h2>

    <p id="orderNumber"></p>

    <p class="muted">
      Oshxona tayyorlaydi, kuryer esa aynan sizning joyingizga olib boradi.
    </p>

    <button
      id="doneButton"
    >
      Yopish
    </button>

  </div>

</div>


<!--
  SCRIPT TARTIBI MUHIM:

  1. app.js — asosiy Mini App
  2. secure-order.js — xavfsiz buyurtma RPC bridge
  3. premium.js — Premium UX / Telegram / haptic
-->

<script src="app.js"></script>

<script src="secure-order.js"></script>

<script src="premium.js"></script>


</body>
</html>
