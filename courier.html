<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RastaGo Courier</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="staff-api.js"></script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  background:#f4f6f8;
  color:#111827;
  font-family:Arial,sans-serif
}
header{
  background:#111827;
  color:white;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:100
}
.header{
  max-width:800px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.logo{
  font-size:22px;
  font-weight:bold
}
.refresh{
  border:0;
  background:white;
  color:#111827;
  padding:10px 13px;
  border-radius:10px;
  font-size:17px;
  cursor:pointer
}
.container{
  max-width:800px;
  margin:auto;
  padding:16px
}
.courier-box{
  background:white;
  border-radius:15px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06)
}
.courier-name{
  font-size:17px;
  font-weight:bold
}
.courier-id{
  color:#6b7280;
  font-size:13px;
  margin-top:4px
}
.section-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px
}
.order{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.07)
}
.order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px
}
.order-number{
  font-size:21px;
  font-weight:bold
}
.status{
  background:#fef3c7;
  color:#92400e;
  padding:7px 10px;
  border-radius:9px;
  font-size:12px;
  font-weight:bold
}
.status.courier{
  background:#dbeafe;
  color:#1d4ed8
}
.info{
  background:#f8fafc;
  border-radius:13px;
  padding:13px;
  margin-bottom:10px
}
.info-title{
  color:#6b7280;
  font-size:12px;
  margin-bottom:4px
}
.info-value{
  font-size:16px;
  font-weight:bold
}
.items{
  margin-top:15px
}
.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #e5e7eb
}
.item:last-child{
  border-bottom:0
}
.item-name{
  font-weight:bold
}
.item-qty{
  font-weight:bold
}
.action{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  margin-top:15px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer
}
.take{
  background:#2563eb;
  color:white
}
.deliver{
  background:#16a34a;
  color:white
}
.action:disabled{
  opacity:.55;
  cursor:not-allowed
}
.empty{
  background:white;
  border-radius:18px;
  padding:50px 20px;
  text-align:center;
  color:#6b7280
}
.empty-icon{
  font-size:45px;
  margin-bottom:10px
}
.loading{
  text-align:center;
  padding:50px;
  color:#6b7280
}
.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  display:none;
  z-index:999;
  max-width:90%;
  text-align:center
}
.error-box{
  background:#fee2e2;
  color:#991b1b;
  border-radius:15px;
  padding:18px;
  line-height:1.5
}
</style>
<link rel="stylesheet" href="staff-ui.css">
</head>

<body>

<header>
  <div class="header">
    <div class="logo">🚚 RastaGo Courier</div>

    <button
      class="refresh"
      onclick="manualRefresh()"
    >
      🔄
    </button>
  </div>
</header>

<div class="container">

  <div
    id="courierBox"
    class="courier-box"
  >
    <div class="loading">
      Courier aniqlanmoqda...
    </div>
  </div>

  <div class="section-title">
    Yetkazilishi kerak
  </div>

  <div
    id="orders"
    class="loading"
  >
    Yuklanmoqda...
  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL =
"https://uqgckzrmibdgxkxdfzav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KBodwmECQvN46zDKjOwfhg_fet6nBiy";

const tg =
window.Telegram &&
window.Telegram.WebApp
  ? window.Telegram.WebApp
  : null;

if(tg){
  tg.ready();
  tg.expand();
}

/* =========================
   TELEGRAM COURIER
========================= */

let telegramId = null;
let courier = null;

function getTelegramId(){

  if(!tg ||
     !tg.initDataUnsafe ||
     !tg.initDataUnsafe.user){

    return null;
  }

  return tg.initDataUnsafe.user.id;
}

/* =========================
   LOAD COURIER
========================= */

async function loadCourier(){

  try{

    const me =
      await RastaGoStaffApi.whoami();

    if(me.role !== "courier"){
      throw new Error("Bu panel uchun courier huquqi kerak.");
    }

    telegramId = me.telegram_id;

    courier = {
      id: null,
      full_name: me.name || "Courier",
      telegram_id: me.telegram_id,
      is_active: true
    };

    document.getElementById("courierBox").innerHTML = `
      <div class="courier-name">
        👤 ${escapeHtml(courier.full_name)}
      </div>
      <div class="courier-id">
        Telegram ID: ${escapeHtml(String(courier.telegram_id))}
      </div>
    `;

    return true;

  }catch(error){

    console.log(error);

    document.getElementById("courierBox").innerHTML = `
      <div class="error-box">❌ ${escapeHtml(error.message)}</div>
    `;

    document.getElementById("orders").innerHTML = `
      <div class="empty">
        Courier paneliga kirish uchun Telegram orqali tasdiqlangan faol courier bo‘lish kerak.
      </div>
    `;

    return false;
  }
}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(
  preserveScroll = true
){

  if(!courier)
    return;

  const scrollY = window.scrollY;
  const box = document.getElementById("orders");

  if(!preserveScroll){
    box.innerHTML = `<div class="loading">Yuklanmoqda...</div>`;
  }

  try{

    const snapshot =
      await RastaGoStaffApi.call("courier_snapshot");

    courier = snapshot.courier || courier;

    const orders = [
      ...(snapshot.ready_orders || []),
      ...(snapshot.my_orders || [])
    ];

    const uniqueOrders = [];
    const seen = new Set();

    orders.forEach(order=>{
      if(!seen.has(order.id)){
        seen.add(order.id);
        uniqueOrders.push(order);
      }
    });

    if(!uniqueOrders.length){

      box.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🚚</div>
          <div style="font-size:19px;font-weight:bold;">Hozircha buyurtma yo‘q</div>
          <div style="margin-top:8px">Tayyor buyurtmalar shu yerda ko‘rinadi.</div>
        </div>
      `;

    }else{

      const shopCodes =
        [...new Set(
          uniqueOrders.map(order => order.shop_code).filter(Boolean)
        )];

      const shops = await loadShops(shopCodes);
      renderOrders(uniqueOrders, shops);
    }

    if(preserveScroll){
      requestAnimationFrame(()=>window.scrollTo(0, scrollY));
    }

  }catch(error){

    console.log(error);

    box.innerHTML = `
      <div class="error-box">
        ❌ Server bilan bog‘lanishda xatolik.
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}


/* =========================
   SHOPS
========================= */

async function loadShops(codes){

  if(!codes.length)
    return {};

  const filter =
    codes
      .map(code =>
        `"${String(code)
          .replace(/"/g,'\\"')}"`
      )
      .join(",");

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/shops" +
        "?select=shop_code,display_name,address" +
        "&shop_code=in.(" +
        encodeURIComponent(filter) +
        ")",
        {
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY
          }
        }
      );

    if(!response.ok)
      return {};

    const data =
      await response.json();

    const result = {};

    data.forEach(shop=>{

      result[shop.shop_code] =
        shop;

    });

    return result;

  }catch(error){

    console.log(error);

    return {};
  }
}


/* =========================
   RENDER
========================= */

function renderOrders(
  orders,
  shops
){

  const box =
    document.getElementById("orders");

  let html = "";

  orders.forEach(order=>{

    const shop =
      shops[order.shop_code] || {};

    const shopName =
      shop.display_name ||
      order.shop_code ||
      "Do‘kon";

    const address =
      order.delivery_address ||
      shop.address ||
      "Manzil ko‘rsatilmagan";

    const status =
      order.status;

    const items =
      Array.isArray(order.items)
      ? order.items
      : [];

    let itemsHtml = "";

    items.forEach(item=>{

      const name =
        item.name ||
        "Mahsulot";

      const qty =
        item.quantity ||
        item.qty ||
        0;

      itemsHtml += `
        <div class="item">

          <div class="item-name">
            ${escapeHtml(name)}
          </div>

          <div class="item-qty">
            ${escapeHtml(String(qty))}
            dona
          </div>

        </div>
      `;
    });

    html += `
      <div class="order">

        <div class="order-header">

          <div class="order-number">
            🧾 ${escapeHtml(
              order.order_number ||
              ("#" + order.id)
            )}
          </div>

          <div class="status ${
            status === "courier"
            ? "courier"
            : ""
          }">

            ${
              status === "courier"
              ? "🚚 KURYERDA"
              : "✅ TAYYOR"
            }

          </div>

        </div>


        <div class="info">

          <div class="info-title">
            DO‘KON
          </div>

          <div class="info-value">
            🏪 ${escapeHtml(shopName)}
          </div>

        </div>


        <div class="info">

          <div class="info-title">
            YETKAZIB BERISH MANZILI
          </div>

          <div class="info-value">
            📍 ${escapeHtml(address)}
          </div>

        </div>


        <div class="info">

          <div class="info-title">
            MIJOZ
          </div>

          <div class="info-value">
            👤 ${escapeHtml(
              order.customer_name ||
              "Ko‘rsatilmagan"
            )}
          </div>

        </div>


        <div class="info">

          <div class="info-title">
            TELEFON
          </div>

          <div class="info-value">
            📞 ${escapeHtml(
              order.phone ||
              "Ko‘rsatilmagan"
            )}
          </div>

        </div>


        <div class="items">

          <div style="
            font-size:13px;
            color:#6b7280;
            margin-bottom:5px;
          ">
            BUYURTMADAGI MAHSULOTLAR
          </div>

          ${
            itemsHtml ||
            `<div style="color:#6b7280">
              Mahsulotlar ko‘rsatilmagan
            </div>`
          }

        </div>


        ${
          status === "ready"
          ?

          `
          <button
            id="take-${order.id}"
            class="action take"
            onclick="takeOrder(${order.id})"
          >
            🚚 BUYURTMANI OLDIM
          </button>
          `

          :

          `
          <button
            id="deliver-${order.id}"
            class="action deliver"
            onclick="deliverOrder(${order.id})"
          >
            ✅ YETKAZIB BERILDI
          </button>
          `
        }

      </div>
    `;
  });

  box.innerHTML =
    html;
}


/* =========================
   TAKE ORDER
========================= */

async function takeOrder(id){

  const button = document.getElementById("take-" + id);
  if(button) button.disabled = true;

  try{

    const payload =
      await RastaGoStaffApi.call("courier_take", {
        order_id: Number(id)
      });

    const result = payload.result;

    if(!result?.success){
      throw new Error(result?.message || "Buyurtmani olib bo‘lmadi");
    }

    showToast("🚚 Buyurtma sizga biriktirildi!");
    setTimeout(()=>loadOrders(true), 500);

  }catch(error){

    console.log(error);
    showToast("❌ " + error.message);

  }finally{

    if(button) button.disabled = false;
  }
}


/* =========================
   DELIVER
========================= */

async function deliverOrder(id){

  const confirmed =
    confirm("Bu buyurtma mijozga/do‘konga topshirildimi?");

  if(!confirmed)
    return;

  const button = document.getElementById("deliver-" + id);
  if(button) button.disabled = true;

  try{

    const payload =
      await RastaGoStaffApi.call("courier_deliver", {
        order_id: Number(id)
      });

    const result = payload.result;

    if(!result?.success){
      throw new Error(result?.message || "Yetkazilgan deb belgilanmadi");
    }

    showToast("✅ Buyurtma yetkazildi!");
    setTimeout(()=>loadOrders(true), 500);

  }catch(error){

    console.log(error);
    showToast("❌ " + error.message);

  }finally{

    if(button) button.disabled = false;
  }
}


/* =========================
   REFRESH
========================= */

function manualRefresh(){

  loadOrders(false);

}


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    text;

  toast.style.display =
    "block";

  setTimeout(()=>{

    toast.style.display =
      "none";

  },2500);

}


/* =========================
   START
========================= */

async function start(){

  const success =
    await loadCourier();

  if(success){

    await loadOrders(false);

    setInterval(
      ()=>loadOrders(true),
      15000
    );

  }

}

start();

</script>

</body>
</html>
