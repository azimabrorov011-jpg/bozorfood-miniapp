<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RastaGo Courier</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  background:#f4f6f8;
  color:#111827;
  font-family:Arial,sans-serif
}
header{
  background:#111827;
  color:white;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:100
}
.header{
  max-width:800px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.logo{
  font-size:22px;
  font-weight:bold
}
.refresh{
  border:0;
  background:white;
  color:#111827;
  padding:10px 13px;
  border-radius:10px;
  font-size:17px;
  cursor:pointer
}
.container{
  max-width:800px;
  margin:auto;
  padding:16px
}
.courier-box{
  background:white;
  border-radius:15px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06)
}
.courier-name{
  font-size:17px;
  font-weight:bold
}
.courier-id{
  color:#6b7280;
  font-size:13px;
  margin-top:4px
}
.section-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px
}
.order{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.07)
}
.order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px
}
.order-number{
  font-size:21px;
  font-weight:bold
}
.status{
  background:#fef3c7;
  color:#92400e;
  padding:7px 10px;
  border-radius:9px;
  font-size:12px;
  font-weight:bold
}
.status.courier{
  background:#dbeafe;
  color:#1d4ed8
}
.info{
  background:#f8fafc;
  border-radius:13px;
  padding:13px;
  margin-bottom:10px
}
.info-title{
  color:#6b7280;
  font-size:12px;
  margin-bottom:4px
}
.info-value{
  font-size:16px;
  font-weight:bold
}
.items{
  margin-top:15px
}
.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #e5e7eb
}
.item:last-child{
  border-bottom:0
}
.item-name{
  font-weight:bold
}
.item-qty{
  font-weight:bold
}
.action{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  margin-top:15px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer
}
.take{
  background:#2563eb;
  color:white
}
.deliver{
  background:#16a34a;
  color:white
}
.action:disabled{
  opacity:.55;
  cursor:not-allowed
}
.empty{
  background:white;
  border-radius:18px;
  padding:50px 20px;
  text-align:center;
  color:#6b7280
}
.empty-icon{
  font-size:45px;
  margin-bottom:10px
}
.loading{
  text-align:center;
  padding:50px;
  color:#6b7280
}
.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  display:none;
  z-index:999;
  max-width:90%;
  text-align:center
}
.error-box{
  background:#fee2e2;
  color:#991b1b;
  border-radius:15px;
  padding:18px;
  line-height:1.5
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">🚚 RastaGo Courier</div>

    <button
      class="refresh"
      onclick="manualRefresh()"
    >
      🔄
    </button>
  </div>
</header>

<div class="container">

  <div
    id="courierBox"
    class="courier-box"
  >
    <div class="loading">
      Courier aniqlanmoqda...
    </div>
  </div>

  <div class="section-title">
    Yetkazilishi kerak
  </div>

  <div
    id="orders"
    class="loading"
  >
    Yuklanmoqda...
  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL =
"https://uqgckzrmibdgxkxdfzav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KBodwmECQvN46zDKjOwfhg_fet6nBiy";

const tg =
window.Telegram &&
window.Telegram.WebApp
  ? window.Telegram.WebApp
  : null;

if(tg){
  tg.ready();
  tg.expand();
}

/* =========================
   TELEGRAM COURIER
========================= */

let telegramId = null;
let courier = null;

function getTelegramId(){

  if(!tg ||
     !tg.initDataUnsafe ||
     !tg.initDataUnsafe.user){

    return null;
  }

  return tg.initDataUnsafe.user.id;
}

/* =========================
   LOAD COURIER
========================= */

async function loadCourier(){

  telegramId = getTelegramId();

  /*
    Telegram tashqarisida test qilish
    uchun vaqtincha ID qo'yish mumkin.
    
    Masalan:
    telegramId = 123456789;
    
    REAL rejimda buni qo'ymaymiz.
  */

  if(!telegramId){

    document.getElementById("courierBox").innerHTML = `
      <div class="error-box">
        <b>⚠️ Courier aniqlanmadi</b>
        <br><br>
        Bu panel Telegram orqali ochilishi kerak.
      </div>
    `;

    document.getElementById("orders").innerHTML = `
      <div class="empty">
        Courier Telegram orqali kirishi kerak.
      </div>
    `;

    return false;
  }

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/couriers" +
        "?select=id,full_name,phone,telegram_id,is_active" +
        "&telegram_id=eq." +
        encodeURIComponent(telegramId) +
        "&is_active=eq.true" +
        "&limit=1",
        {
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY
          }
        }
      );

    if(!response.ok){

      throw new Error(
        await response.text()
      );
    }

    const data =
      await response.json();

    if(!data.length){

      document.getElementById("courierBox").innerHTML = `
        <div class="error-box">
          <b>❌ Siz courier sifatida ro‘yxatdan o‘tmagansiz.</b>
          <br><br>
          Telegram ID:
          <b>${escapeHtml(String(telegramId))}</b>
        </div>
      `;

      document.getElementById("orders").innerHTML = `
        <div class="empty">
          Faol courier topilmadi.
        </div>
      `;

      return false;
    }

    courier = data[0];

    document.getElementById("courierBox").innerHTML = `
      <div class="courier-name">
        👤 ${escapeHtml(courier.full_name)}
      </div>

      <div class="courier-id">
        Courier ID: ${escapeHtml(String(courier.id))}
      </div>
    `;

    return true;

  }catch(error){

    console.log(error);

    document.getElementById("courierBox").innerHTML = `
      <div class="error-box">
        ❌ Courier ma'lumotlarini yuklashda xatolik.
      </div>
    `;

    return false;
  }
}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(
  preserveScroll = true
){

  if(!courier)
    return;

  const scrollY =
    window.scrollY;

  const box =
    document.getElementById("orders");

  if(!preserveScroll){

    box.innerHTML =
      `<div class="loading">
        Yuklanmoqda...
      </div>`;
  }

  try{

    /*
      READY buyurtmalar:
      hali assignment yo‘q.

      COURIER buyurtmalar:
      aynan shu courierga biriktirilgan.
    */

    const readyResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders" +
        "?select=*" +
        "&status=eq.ready" +
        "&order=created_at.asc",
        {
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY
          }
        }
      );

    const courierResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders" +
        "?select=*" +
        "&status=eq.courier" +
        "&order=created_at.asc",
        {
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY
          }
        }
      );

    if(!readyResponse.ok ||
       !courierResponse.ok){

      throw new Error(
        "Buyurtmalarni yuklab bo‘lmadi"
      );
    }

    const readyOrders =
      await readyResponse.json();

    const courierOrdersAll =
      await courierResponse.json();

    /*
      Courier statusdagi buyurtmalardan
      faqat o‘ziga tegishlisini qoldiramiz.
    */

    const assignmentResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/order_assignments" +
        "?select=order_id,courier_id,picked_up_at,delivered_at" +
        "&courier_id=eq." +
        courier.id +
        "&delivered_at=is.null",
        {
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY
          }
        }
      );

    if(!assignmentResponse.ok){

      throw new Error(
        await assignmentResponse.text()
      );
    }

    const assignments =
      await assignmentResponse.json();

    const myOrderIds =
      new Set(
        assignments.map(
          a => Number(a.order_id)
        )
      );

    const myCourierOrders =
      courierOrdersAll.filter(
        order =>
          myOrderIds.has(
            Number(order.id)
          )
      );

    /*
      READY buyurtmalar hamma courierga
      ko‘rinadi.

      Lekin olish vaqtida Supabase
      function ikkinchi courierni to‘sadi.
    */

    const orders = [
      ...readyOrders,
      ...myCourierOrders
    ];

    /*
      Takroriy orderlarni olib tashlash
    */

    const uniqueOrders = [];

    const seen = new Set();

    orders.forEach(order=>{

      if(!seen.has(order.id)){

        seen.add(order.id);

        uniqueOrders.push(order);
      }

    });

    if(!uniqueOrders.length){

      box.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            🚚
          </div>

          <div style="
            font-size:19px;
            font-weight:bold;
          ">
            Hozircha buyurtma yo‘q
          </div>

          <div style="margin-top:8px">
            Tayyor buyurtmalar shu yerda ko‘rinadi.
          </div>

        </div>
      `;

    }else{

      const shopCodes =
        [...new Set(
          uniqueOrders
            .map(order => order.shop_code)
            .filter(Boolean)
        )];

      const shops =
        await loadShops(shopCodes);

      renderOrders(
        uniqueOrders,
        shops
      );
    }

    if(preserveScroll){

      requestAnimationFrame(()=>{

        window.scrollTo(
          0,
          scrollY
        );

      });
    }

  }catch(error){

    console.log(error);

    box.innerHTML = `
      <div class="error-box">
        ❌ Server bilan bog‘lanishda xatolik.
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}


/* =========================
   SHOPS
========================= */

async function loadShops(codes){

  if(!codes.length)
    return {};

  const filter =
    codes
      .map(code =>
        `"${String(code)
          .replace(/"/g,'\\"')}"`
      )
      .join(",");

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/shops" +
        "?select=shop_code,display_name,address" +
        "&shop_code=in.(" +
        encodeURIComponent(filter) +
        ")",
        {
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY
          }
        }
      );

    if(!response.ok)
      return {};

    const data =
      await response.json();

    const result = {};

    data.forEach(shop=>{

      result[shop.shop_code] =
        shop;

    });

    return result;

  }catch(error){

    console.log(error);

    return {};
  }
}


/* =========================
   RENDER
========================= */

function renderOrders(
  orders,
  shops
){

  const box =
    document.getElementById("orders");

  let html = "";

  orders.forEach(order=>{

    const shop =
      shops[order.shop_code] || {};

    const shopName =
      shop.display_name ||
      order.shop_code ||
      "Do‘kon";

    const address =
      order.delivery_address ||
      shop.address ||
      "Manzil ko‘rsatilmagan";

    const status =
      order.status;

    const items =
      Array.isArray(order.items)
      ? order.items
      : [];

    let itemsHtml = "";

    items.forEach(item=>{

      const name =
        item.name ||
        "Mahsulot";

      const qty =
        item.quantity ||
        item.qty ||
        0;

      itemsHtml += `
        <div class="item">

          <div class="item-name">
            ${escapeHtml(name)}
          </div>

          <div class="item-qty">
            ${escapeHtml(String(qty))}
            dona
          </div>

        </div>
      `;
    });

    html += `
      <div class="order">

        <div class="order-header">

          <div class="order-number">
            🧾 ${escapeHtml(
              order.order_number ||
              ("#" + order.id)
            )}
          </div>

          <div class="status ${
            status === "courier"
            ? "courier"
            : ""
          }">

            ${
              status === "courier"
              ? "🚚 KURYERDA"
              : "✅ TAYYOR"
            }

          </div>

        </div>


        <div class="info">

          <div class="info-title">
            DO‘KON
          </div>

          <div class="info-value">
            🏪 ${escapeHtml(shopName)}
          </div>

        </div>


        <div class="info">

          <div class="info-title">
            YETKAZIB BERISH MANZILI
          </div>

          <div class="info-value">
            📍 ${escapeHtml(address)}
          </div>

        </div>


        <div class="info">

          <div class="info-title">
            MIJOZ
          </div>

          <div class="info-value">
            👤 ${escapeHtml(
              order.customer_name ||
              "Ko‘rsatilmagan"
            )}
          </div>

        </div>


        <div class="info">

          <div class="info-title">
            TELEFON
          </div>

          <div class="info-value">
            📞 ${escapeHtml(
              order.phone ||
              "Ko‘rsatilmagan"
            )}
          </div>

        </div>


        <div class="items">

          <div style="
            font-size:13px;
            color:#6b7280;
            margin-bottom:5px;
          ">
            BUYURTMADAGI MAHSULOTLAR
          </div>

          ${
            itemsHtml ||
            `<div style="color:#6b7280">
              Mahsulotlar ko‘rsatilmagan
            </div>`
          }

        </div>


        ${
          status === "ready"
          ?

          `
          <button
            id="take-${order.id}"
            class="action take"
            onclick="takeOrder(${order.id})"
          >
            🚚 BUYURTMANI OLDIM
          </button>
          `

          :

          `
          <button
            id="deliver-${order.id}"
            class="action deliver"
            onclick="deliverOrder(${order.id})"
          >
            ✅ YETKAZIB BERILDI
          </button>
          `
        }

      </div>
    `;
  });

  box.innerHTML =
    html;
}


/* =========================
   TAKE ORDER
========================= */

async function takeOrder(id){

  if(!telegramId){

    showToast(
      "❌ Telegram courier aniqlanmadi"
    );

    return;
  }

  const button =
    document.getElementById(
      "take-" + id
    );

  if(button)
    button.disabled = true;

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/courier_take_order",
        {
          method:"POST",

          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            p_order_id:id,
            p_telegram_id:
              telegramId
          })
        }
      );

    const result =
      await response.json();

    if(!response.ok){

      throw new Error(
        result.message ||
        JSON.stringify(result)
      );
    }

    if(!result.success){

      showToast(
        "❌ " +
        (result.message ||
        "Buyurtmani olib bo‘lmadi")
      );

      return;
    }

    showToast(
      "🚚 Buyurtma sizga biriktirildi!"
    );

    setTimeout(
      ()=>loadOrders(true),
      500
    );

  }catch(error){

    console.log(error);

    showToast(
      "❌ " + error.message
    );

  }finally{

    if(button)
      button.disabled = false;
  }
}


/* =========================
   DELIVER
========================= */

async function deliverOrder(id){

  if(!telegramId){

    showToast(
      "❌ Telegram courier aniqlanmadi"
    );

    return;
  }

  const confirmed =
    confirm(
      "Bu buyurtma mijozga/do‘konga topshirildimi?"
    );

  if(!confirmed)
    return;

  const button =
    document.getElementById(
      "deliver-" + id
    );

  if(button)
    button.disabled = true;

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/courier_deliver_order",
        {
          method:"POST",

          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            p_order_id:id,
            p_telegram_id:
              telegramId
          })
        }
      );

    const result =
      await response.json();

    if(!response.ok){

      throw new Error(
        result.message ||
        JSON.stringify(result)
      );
    }

    if(!result.success){

      showToast(
        "❌ " +
        (result.message ||
        "Yetkazilgan deb belgilanmadi")
      );

      return;
    }

    showToast(
      "✅ Buyurtma yetkazildi!"
    );

    setTimeout(
      ()=>loadOrders(true),
      500
    );

  }catch(error){

    console.log(error);

    showToast(
      "❌ " + error.message
    );

  }finally{

    if(button)
      button.disabled = false;
  }
}


/* =========================
   REFRESH
========================= */

function manualRefresh(){

  loadOrders(false);

}


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    text;

  toast.style.display =
    "block";

  setTimeout(()=>{

    toast.style.display =
      "none";

  },2500);

}


/* =========================
   START
========================= */

async function start(){

  const success =
    await loadCourier();

  if(success){

    await loadOrders(false);

    setInterval(
      ()=>loadOrders(true),
      15000
    );

  }

}

start();

</script>

</body>
</html>
