<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RastaGo Admin</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 21px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn {
      background: white;
      color: #111827;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-green {
      background: #16a34a;
      color: white;
    }

    .btn-red {
      background: #dc2626;
      color: white;
    }

    .btn-gray {
      background: #6b7280;
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .stat-title {
      color: #6b7280;
      font-size: 13px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
      margin-top: 5px;
    }

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 15px;
      padding-bottom: 5px;
    }

    .filter {
      background: white;
      white-space: nowrap;
    }

    .filter.active {
      background: #2563eb;
      color: white;
    }

    .alert {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .order-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 9px rgba(0,0,0,.07);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .order-number {
      font-size: 18px;
      font-weight: bold;
    }

    .status {
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      background: #e5e7eb;
    }

    .status-new {
      background: #fef3c7;
      color: #92400e;
    }

    .status-preparing {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-ready {
      background: #dcfce7;
      color: #166534;
    }

    .status-courier {
      background: #ede9fe;
      color: #6d28d9;
    }

    .status-delivered {
      background: #d1fae5;
      color: #065f46;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      line-height: 1.7;
      font-size: 14px;
    }

    .items {
      background: #f9fafb;
      border-radius: 9px;
      padding: 10px;
      margin: 10px 0;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .empty {
      background: white;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: #6b7280;
    }

    /* SHOPS */

    #shopsPage {
      display: none;
    }

    .shops-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .shop-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 9px rgba(0,0,0,.07);
    }

    .shop-code {
      font-size: 20px;
      font-weight: bold;
      color: #2563eb;
    }

    .shop-name {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    .shop-address {
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.5;
    }

    .shop-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-box {
      background: white;
      max-width: 500px;
      margin: 30px auto;
      border-radius: 15px;
      padding: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
    }

    #qrBox {
      text-align: center;
      margin-top: 15px;
    }

    #qrcode {
      display: inline-block;
      padding: 12px;
      background: white;
    }

    #qrLink {
      width: 100%;
      margin-top: 12px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .order-top {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-row">
    <h1>🍽 RastaGo Admin</h1>

    <div style="display:flex; gap:7px;">
      <button class="btn" onclick="openOrders()">🧾 Buyurtmalar</button>
      <button class="btn" onclick="openShops()">🏪 Do‘konlar</button>
      <button class="btn" onclick="manualRefresh()">🔄</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- ================= ORDERS ================= -->

  <section id="ordersPage">

    <div class="stats">
      <div class="stat">
        <div class="stat-title">Bugungi buyurtmalar</div>
        <div class="stat-value" id="todayCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Yangi</div>
        <div class="stat-value" id="newCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Tayyorlanmoqda</div>
        <div class="stat-value" id="preparingCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Daromad</div>
        <div class="stat-value" id="revenue">0</div>
      </div>
    </div>

    <div id="newAlert" class="alert">
      🔔 Yangi buyurtma bor!
    </div>

    <div class="filters">
      <button class="filter active" onclick="setFilter('all', this)">Barchasi</button>
      <button class="filter" onclick="setFilter('new', this)">Yangi</button>
      <button class="filter" onclick="setFilter('preparing', this)">Tayyorlanmoqda</button>
      <button class="filter" onclick="setFilter('ready', this)">Tayyor</button>
      <button class="filter" onclick="setFilter('courier', this)">Kuryerda</button>
      <button class="filter" onclick="setFilter('delivered', this)">Yetkazildi</button>
      <button class="filter" onclick="setFilter('cancelled', this)">Bekor</button>
    </div>

    <div id="orders">
      Buyurtmalar yuklanmoqda...
    </div>

  </section>

  <!-- ================= SHOPS ================= -->

  <section id="shopsPage">

    <div class="shops-header">
      <h2>🏪 Do‘konlar</h2>

      <button class="btn-primary" onclick="openAddShop()">
        ➕ Yangi do‘kon
      </button>
    </div>

    <div id="shops">
      Do‘konlar yuklanmoqda...
    </div>

  </section>

</div>

<!-- ================= ADD SHOP MODAL ================= -->

<div id="shopModal" class="modal">

  <div class="modal-box">

    <div class="modal-title">
      ➕ Yangi do‘kon
    </div>

    <label>Do‘kon kodi</label>
    <input id="shopCode" readonly>

    <label>Do‘kon nomi</label>
    <input id="shopDisplayName" placeholder="Masalan: Ali oshxonasi">

    <label>Bozor nomi</label>
    <input id="shopMarketName" placeholder="Masalan: Chilonzor bozori">

    <label>Qator</label>
    <input id="shopRowName" placeholder="Masalan: 3-qator">

    <label>Do‘kon raqami</label>
    <input id="shopNumber" placeholder="Masalan: 47">

    <div class="modal-actions">
      <button class="btn-gray" onclick="closeShopModal()">
        Bekor qilish
      </button>

      <button class="btn-primary" onclick="saveShop()">
        💾 Saqlash
      </button>
    </div>

  </div>

</div>

<!-- ================= QR MODAL ================= -->

<div id="qrModal" class="modal">

  <div class="modal-box">

    <div class="modal-title" id="qrTitle">
      QR kod
    </div>

    <div id="qrBox">
      <div id="qrcode"></div>

      <input id="qrLink" readonly>

      <div class="modal-actions">
        <button class="btn-primary" onclick="copyQRLink()">
          📋 Nusxalash
        </button>

        <button class="btn-green" onclick="printQR()">
          🖨 Chop etish
        </button>

        <button class="btn-gray" onclick="closeQR()">
          Yopish
        </button>
      </div>
    </div>

  </div>

</div>

<script>

const SUPABASE_URL = "https://uqgckzrmibdgxkxdfzav.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_KBodwmECQvN46zDKjOwfhg_fet6nBiy";

const MINI_APP_URL =
  "https://azimabrorov011-jpg.github.io/bozorfood-miniapp/";

let allOrders = [];
let allShops = [];
let currentFilter = "all";

/* ================= SUPABASE ================= */

async function supabaseFetch(table, options = {}) {

  const url =
    SUPABASE_URL +
    "/rest/v1/" +
    table +
    (options.query || "");

  const response = await fetch(url, {
    method: options.method || "GET",

    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": options.prefer || "return=representation"
    },

    body: options.body
      ? JSON.stringify(options.body)
      : undefined
  });

  const text = await response.text();

  if (!response.ok) {
    throw new Error(text || "Supabase xatosi");
  }

  return text ? JSON.parse(text) : [];
}

/* ================= ORDERS ================= */

async function loadOrders() {

  try {

    const orders = await supabaseFetch(
      "orders",
      {
        query:
          "?select=*&order=created_at.desc"
      }
    );

    allOrders = orders || [];

    renderStats();
    renderOrders();

  } catch (error) {

    console.error(error);

    document.getElementById("orders").innerHTML =
      `
      <div class="empty">
        ❌ Buyurtmalarni yuklashda xatolik
        <br><br>
        <small>${escapeHtml(error.message)}</small>
      </div>
      `;
  }
}

/* ================= STATS ================= */

function renderStats() {

  const today = new Date();

  const todayOrders = allOrders.filter(order => {

    const d = new Date(order.created_at);

    return (
      d.getFullYear() === today.getFullYear() &&
      d.getMonth() === today.getMonth() &&
      d.getDate() === today.getDate()
    );

  });

  const newOrders =
    allOrders.filter(x => x.status === "new");

  const preparingOrders =
    allOrders.filter(x => x.status === "preparing");

  const revenue =
    todayOrders.reduce(
      (sum, x) => sum + Number(x.total || 0),
      0
    );

  document.getElementById("todayCount").textContent =
    todayOrders.length;

  document.getElementById("newCount").textContent =
    newOrders.length;

  document.getElementById("preparingCount").textContent =
    preparingOrders.length;

  document.getElementById("revenue").textContent =
    revenue.toLocaleString("uz-UZ") + " so‘m";

  document.getElementById("newAlert").style.display =
    newOrders.length > 0 ? "block" : "none";
}

/* ================= FILTER ================= */

function setFilter(filter, button) {

  currentFilter = filter;

  document.querySelectorAll(".filter")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");

  renderOrders();
}

/* ================= RENDER ORDERS ================= */

function renderOrders() {

  let orders = [...allOrders];

  if (currentFilter !== "all") {

    orders = orders.filter(
      x => x.status === currentFilter
    );

  }

  const container =
    document.getElementById("orders");

  if (!orders.length) {

    container.innerHTML =
      `
      <div class="empty">
        📭 Buyurtmalar topilmadi
      </div>
      `;

    return;
  }

  container.innerHTML =
    orders.map(renderOrder).join("");
}

/* ================= ORDER CARD ================= */

function renderOrder(order) {

  const statusText = {

    new: "Yangi",

    preparing: "Tayyorlanmoqda",

    ready: "Tayyor",

    courier: "Kuryerda",

    delivered: "Yetkazildi",

    cancelled: "Bekor qilingan"

  }[order.status] || order.status;

  const items =
    Array.isArray(order.items)
      ? order.items
      : [];

  const itemsHtml =
    items.map(item => {

      const qty =
        Number(item.quantity || item.qty || 0);

      const price =
        Number(item.price || 0);

      return `
        <div class="item-row">
          <span>
            ${escapeHtml(item.name || "Mahsulot")}
            × ${qty}
          </span>

          <span>
            ${(price * qty).toLocaleString("uz-UZ")}
          </span>
        </div>
      `;

    }).join("");

  const time =
    order.created_at
      ? new Date(order.created_at)
          .toLocaleString("uz-UZ")
      : "";

  return `
    <div class="order-card">

      <div class="order-top">

        <div class="order-number">
          #${escapeHtml(order.order_number || order.id)}
        </div>

        <div class="status status-${order.status}">
          ${statusText}
        </div>

      </div>

      <div class="info">

        🏪 <b>Do‘kon:</b>
        ${escapeHtml(order.shop_code || "-")}
        <br>

        👤 <b>Mijoz:</b>
        ${escapeHtml(order.customer_name || "-")}
        <br>

        📞 <b>Telefon:</b>
        ${escapeHtml(order.phone || "-")}
        <br>

        🕐 <b>Vaqt:</b>
        ${escapeHtml(time)}

      </div>

      <div class="items">
        ${itemsHtml || "Mahsulotlar yo‘q"}
      </div>

      ${
        order.note
        ? `
          <div class="info">
            📝 <b>Izoh:</b>
            ${escapeHtml(order.note)}
          </div>
        `
        : ""
      }

      <div class="total">
        Jami:
        ${Number(order.total || 0).toLocaleString("uz-UZ")}
        so‘m
      </div>

      <div class="actions">

        ${getOrderButtons(order)}

      </div>

    </div>
  `;
}

/* ================= ORDER BUTTONS ================= */

function getOrderButtons(order) {

  const id = order.id;

  let html = "";

  if (order.status === "new") {

    html += `
      <button class="btn-primary"
        onclick="changeStatus(${id}, 'preparing')">
        👨‍🍳 Tayyorlash
      </button>
    `;

  }

  if (order.status === "preparing") {

    html += `
      <button class="btn-green"
        onclick="changeStatus(${id}, 'ready')">
        ✅ Tayyor
      </button>
    `;

  }

  if (order.status === "ready") {

    html += `
      <button class="btn-primary"
        onclick="changeStatus(${id}, 'courier')">
        🚴 Kuryerga
      </button>
    `;

  }

  if (order.status === "courier") {

    html += `
      <button class="btn-green"
        onclick="changeStatus(${id}, 'delivered')">
        📦 Yetkazildi
      </button>
    `;

  }

  if (
    order.status !== "delivered" &&
    order.status !== "cancelled"
  ) {

    html += `
      <button class="btn-red"
        onclick="changeStatus(${id}, 'cancelled')">
        ❌ Bekor
      </button>
    `;

  }

  return html;
}

/* ================= CHANGE STATUS ================= */

async function changeStatus(id, status) {

  try {

    await supabaseFetch(
      "orders?id=eq." + id,
      {
        method: "PATCH",
        query: "?id=eq." + id,
        body: {
          status: status
        },
        prefer: "return=minimal"
      }
    );

    await loadOrders();

  } catch (error) {

    console.error(error);

    alert(
      "Statusni o‘zgartirishda xatolik:\n\n" +
      error.message
    );

  }
}

/* ================= SHOPS ================= */

async function loadShops() {

  try {

    const shops =
      await supabaseFetch(
        "shops",
        {
          query:
            "?select=*&order=shop_code.asc"
        }
      );

    allShops = shops || [];

    renderShops();

  } catch (error) {

    console.error(error);

    document.getElementById("shops").innerHTML =
      `
      <div class="empty">
        ❌ Do‘konlarni yuklashda xatolik
        <br><br>
        <small>${escapeHtml(error.message)}</small>
      </div>
      `;
  }
}

/* ================= RENDER SHOPS ================= */

function renderShops() {

  const container =
    document.getElementById("shops");

  if (!allShops.length) {

    container.innerHTML =
      `
      <div class="empty">
        🏪 Hozircha do‘konlar yo‘q
      </div>
      `;

    return;
  }

  container.innerHTML =
    allShops.map(shop => {

      return `
        <div class="shop-card">

          <div class="shop-code">
            ${escapeHtml(shop.shop_code || "-")}
          </div>

          <div class="shop-name">
            ${escapeHtml(
              shop.display_name ||
              shop.market_name ||
              "Do‘kon"
            )}
          </div>

          <div class="shop-address">
            📍 ${escapeHtml(
              shop.address ||
              makeAddress(shop)
            )}
          </div>

          <div class="shop-actions">

            <button class="btn-primary"
              onclick="showQR('${escapeJs(shop.shop_code)}')">
              📱 QR kod
            </button>

            <button class="btn-gray"
              onclick="copyShopLink('${escapeJs(shop.shop_code)}')">
              🔗 Link
            </button>

          </div>

        </div>
      `;

    }).join("");
}

/* ================= ADD SHOP ================= */

function openAddShop() {

  document.getElementById("shopModal").style.display =
    "block";

  document.getElementById("shopCode").value =
    getNextShopCode();

  document.getElementById("shopDisplayName").value = "";
  document.getElementById("shopMarketName").value = "";
  document.getElementById("shopRowName").value = "";
  document.getElementById("shopNumber").value = "";
}

function closeShopModal() {

  document.getElementById("shopModal").style.display =
    "none";
}

/* ================= NEXT SHOP CODE ================= */

function getNextShopCode() {

  let max = 0;

  allShops.forEach(shop => {

    const match =
      String(shop.shop_code || "")
        .match(/^B(\d+)$/i);

    if (match) {

      const num =
        parseInt(match[1], 10);

      if (num > max) {
        max = num;
      }

    }

  });

  return "B" +
    String(max + 1).padStart(3, "0");
}

/* ================= ADDRESS ================= */

function makeAddress(shop) {

  return [
    shop.market_name,
    shop.row_name,
    shop.shop_number
      ? "Do‘kon " + shop.shop_number
      : ""
  ]
    .filter(Boolean)
    .join(", ");
}

/* ================= SAVE SHOP ================= */

async function saveShop() {

  const shopCode =
    document.getElementById("shopCode").value.trim();

  const displayName =
    document.getElementById("shopDisplayName").value.trim();

  const marketName =
    document.getElementById("shopMarketName").value.trim();

  const rowName =
    document.getElementById("shopRowName").value.trim();

  const shopNumber =
    document.getElementById("shopNumber").value.trim();

  if (!displayName) {
    alert("Do‘kon nomini kiriting.");
    return;
  }

  if (!marketName) {
    alert("Bozor nomini kiriting.");
    return;
  }

  if (!rowName) {
    alert("Qatorni kiriting.");
    return;
  }

  if (!shopNumber) {
    alert("Do‘kon raqamini kiriting.");
    return;
  }

  const address =
    [
      marketName,
      rowName,
      "Do‘kon " + shopNumber
    ].join(", ");

  try {

    await supabaseFetch(
      "shops",
      {
        method: "POST",
        body: {
          shop_code: shopCode,
          market_name: marketName,
          row_name: rowName,
          shop_number: shopNumber,
          display_name: displayName,
          address: address,
          is_active: true
        }
      }
    );

    closeShopModal();

    await loadShops();

    alert(
      "✅ " +
      shopCode +
      " do‘koni muvaffaqiyatli qo‘shildi!"
    );

  } catch (error) {

    console.error(error);

    alert(
      "Do‘kon qo‘shishda xatolik:\n\n" +
      error.message
    );

  }
}

/* ================= QR ================= */

function showQR(shopCode) {

  const shop =
    allShops.find(
      x => x.shop_code === shopCode
    );

  if (!shop) {
    alert("Do‘kon topilmadi.");
    return;
  }

  const link =
    MINI_APP_URL +
    "?shop=" +
    encodeURIComponent(shopCode);

  document.getElementById("qrModal").style.display =
    "block";

  document.getElementById("qrTitle").textContent =
    "📱 " +
    shopCode +
    " — " +
    (shop.display_name || "Do‘kon");

  document.getElementById("qrLink").value =
    link;

  const qr =
    document.getElementById("qrcode");

  qr.innerHTML = "";

  if (typeof QRCode === "undefined") {

    qr.innerHTML =
      "<p>❌ QR kutubxonasi yuklanmadi.</p>";

    return;
  }

  new QRCode(qr, {
    text: link,
    width: 220,
    height: 220
  });
}

function closeQR() {

  document.getElementById("qrModal").style.display =
    "none";
}

function copyQRLink() {

  const input =
    document.getElementById("qrLink");

  navigator.clipboard.writeText(input.value)
    .then(() => {
      alert("✅ Link nusxalandi");
    })
    .catch(() => {

      input.select();
      document.execCommand("copy");

      alert("✅ Link nusxalandi");
    });
}

function copyShopLink(shopCode) {

  const link =
    MINI_APP_URL +
    "?shop=" +
    encodeURIComponent(shopCode);

  navigator.clipboard.writeText(link)
    .then(() => {
      alert("✅ QR link nusxalandi");
    })
    .catch(() => {

      prompt(
        "Linkni nusxalang:",
        link
      );

    });
}

/* ================= PRINT QR ================= */

function printQR() {

  const qr =
    document.getElementById("qrcode");

  const title =
    document.getElementById("qrTitle")
      .textContent;

  const link =
    document.getElementById("qrLink")
      .value;

  const image =
    qr.querySelector("img");

  const canvas =
    qr.querySelector("canvas");

  let imageUrl = "";

  if (image) {
    imageUrl = image.src;
  } else if (canvas) {
    imageUrl = canvas.toDataURL("image/png");
  }

  if (!imageUrl) {

    alert("QR kod tayyor emas.");

    return;
  }

  const printWindow =
    window.open("", "_blank");

  printWindow.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>${escapeHtml(title)}</title>

      <style>
        body {
          font-family: Arial;
          text-align: center;
          padding-top: 40px;
        }

        img {
          width: 280px;
          height: 280px;
        }

        h1 {
          margin-bottom: 25px;
        }

        p {
          word-break: break-all;
        }
      </style>
    </head>

    <body>

      <h1>${escapeHtml(title)}</h1>

      <img src="${imageUrl}">

      <p>${escapeHtml(link)}</p>

      <script>
        window.onload = function() {
          window.print();
        };
      <\/script>

    </body>
    </html>
  `);

  printWindow.document.close();
}

/* ================= PAGE SWITCH ================= */

function openOrders() {

  document.getElementById("shopsPage").style.display =
    "none";

  document.getElementById("ordersPage").style.display =
    "block";

  loadOrders();
}

function openShops() {

  document.getElementById("ordersPage").style.display =
    "none";

  document.getElementById("shopsPage").style.display =
    "block";

  loadShops();
}

/* ================= REFRESH ================= */

async function manualRefresh() {

  if (
    document.getElementById("shopsPage").style.display !==
    "none"
  ) {

    await loadShops();

  } else {

    await loadOrders();

  }

}

/* ================= HELPERS ================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeJs(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}

/* ================= START ================= */

loadOrders();

setInterval(() => {

  if (
    document.getElementById("ordersPage").style.display !==
    "none"
  ) {

    loadOrders();

  }

}, 15000);
