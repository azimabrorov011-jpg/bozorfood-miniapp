<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RastaGo Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .refresh {
      border: 0;
      background: white;
      color: #111827;
      padding: 9px 13px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .stat-title {
      color: #6b7280;
      font-size: 13px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
      margin-top: 5px;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }

    .filter {
      white-space: nowrap;
      border: 0;
      background: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .filter.active {
      background: #111827;
      color: white;
    }

    .order {
      background: white;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .order-number {
      font-size: 21px;
      font-weight: bold;
    }

    .time {
      color: #6b7280;
      font-size: 13px;
      margin-top: 4px;
    }

    .status {
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: bold;
      background: #eee;
      white-space: nowrap;
    }

    .customer {
      margin-top: 14px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 11px;
      line-height: 1.7;
    }

    .items {
      margin-top: 14px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
    }

    .item-name {
      font-weight: 500;
    }

    .item-price {
      color: #374151;
      white-space: nowrap;
    }

    .note {
      margin-top: 12px;
      background: #fff7ed;
      padding: 11px;
      border-radius: 10px;
      color: #9a3412;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .action {
      border: 0;
      padding: 11px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      background: #eef2f7;
    }

    .action:hover {
      opacity: .85;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .order-top {
        flex-direction: column;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-row">
    <h1>🍽 RastaGo Admin</h1>
    <button class="refresh" onclick="loadOrders()">🔄 Yangilash</button>
  </div>
</header>

<div class="container">

  <div class="stats">

    <div class="stat">
      <div class="stat-title">Bugungi buyurtmalar</div>
      <div id="statToday" class="stat-number">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Yangi</div>
      <div id="statNew" class="stat-number">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Tayyorlanmoqda</div>
      <div id="statCooking" class="stat-number">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Daromad</div>
      <div id="statRevenue" class="stat-number">0</div>
    </div>

  </div>

  <div class="filters">

    <button class="filter active" onclick="setFilter('all', this)">
      Barchasi
    </button>

    <button class="filter" onclick="setFilter('new', this)">
      🆕 Yangi
    </button>

    <button class="filter" onclick="setFilter('preparing', this)">
      👨‍🍳 Tayyorlanmoqda
    </button>

    <button class="filter" onclick="setFilter('ready', this)">
      ✅ Tayyor
    </button>

    <button class="filter" onclick="setFilter('courier', this)">
      🛵 Kuryerda
    </button>

    <button class="filter" onclick="setFilter('delivered', this)">
      📦 Yetkazildi
    </button>

    <button class="filter" onclick="setFilter('cancelled', this)">
      ❌ Bekor
    </button>

  </div>

  <div id="orders" class="loading">
    Buyurtmalar yuklanmoqda...
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://uqgckzrmibdgxkxdfzav.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_KBodwmECQvN46zDKjOwfhg_fet6nBiy";

let orders = [];
let currentFilter = "all";


const statusNames = {
  new: "🆕 Yangi",
  preparing: "👨‍🍳 Tayyorlanmoqda",
  ready: "✅ Tayyor",
  courier: "🛵 Kuryerda",
  delivered: "📦 Yetkazildi",
  cancelled: "❌ Bekor qilingan"
};


function money(value) {

  return Number(value || 0)
    .toLocaleString("uz-UZ") + " so'm";

}


function formatDate(value) {

  if (!value) return "-";

  const date = new Date(value);

  return date.toLocaleString("uz-UZ", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });

}


async function loadOrders() {

  const container =
    document.getElementById("orders");

  container.innerHTML =
    `<div class="loading">Buyurtmalar yuklanmoqda...</div>`;

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {

      const error =
        await response.text();

      container.innerHTML =
        `<div class="empty">Xatolik: ${error}</div>`;

      return;
    }

    orders = await response.json();

    updateStats();

    renderOrders();

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        Internet yoki server bilan bog‘lanishda xatolik.
      </div>`;

  }

}


function updateStats() {

  const today =
    new Date().toISOString().slice(0, 10);

  const todayOrders =
    orders.filter(order =>
      String(order.created_at || "").startsWith(today)
    );

  const newOrders =
    orders.filter(order =>
      order.status === "new"
    );

  const cookingOrders =
    orders.filter(order =>
      order.status === "preparing"
    );

  const revenue =
    todayOrders
      .filter(order =>
        order.status !== "cancelled"
      )
      .reduce(
        (sum, order) =>
          sum + Number(order.total || 0),
        0
      );

  document.getElementById("statToday")
    .textContent = todayOrders.length;

  document.getElementById("statNew")
    .textContent = newOrders.length;

  document.getElementById("statCooking")
    .textContent = cookingOrders.length;

  document.getElementById("statRevenue")
    .textContent = money(revenue);

}


function setFilter(filter, button) {

  currentFilter = filter;

  document
    .querySelectorAll(".filter")
    .forEach(x =>
      x.classList.remove("active")
    );

  button.classList.add("active");

  renderOrders();

}


function renderOrders() {

  const container =
    document.getElementById("orders");

  let filtered = orders;

  if (currentFilter !== "all") {

    filtered =
      orders.filter(order =>
        order.status === currentFilter
      );

  }

  if (!filtered.length) {

    container.innerHTML =
      `<div class="empty">
        Hozircha buyurtmalar yo‘q.
      </div>`;

    return;
  }


  container.innerHTML =
    filtered.map(order => {

      const items =
        Array.isArray(order.items)
          ? order.items
          : [];


      const itemsHtml =
        items.map(item => {

          const quantity =
            Number(
              item.quantity ||
              item.qty ||
              0
            );

          const price =
            Number(item.price || 0);

          return `
            <div class="item">

              <div class="item-name">
                ${item.name || "Mahsulot"}
                × ${quantity}
              </div>

              <div class="item-price">
                ${money(price * quantity)}
              </div>

            </div>
          `;

        }).join("");


      const status =
        order.status || "new";


      return `

        <div class="order">

          <div class="order-top">

            <div>

              <div class="order-number">
                ${order.order_number || "ORD"}
              </div>

              <div class="time">
                🕐 ${formatDate(order.created_at)}
              </div>

            </div>

            <div class="status">
              ${statusNames[status] || status}
            </div>

          </div>


          <div class="customer">

            🏪 <b>Do‘kon:</b>
            ${order.shop_code || "-"}
            <br>

            👤 <b>Mijoz:</b>
            ${order.customer_name || "-"}
            <br>

            📞 <b>Telefon:</b>
            ${order.phone || "-"}

          </div>


          <div class="items">

            ${itemsHtml || "Mahsulot ma'lumotlari yo‘q"}

          </div>


          ${
            order.note
              ? `
                <div class="note">
                  📝 <b>Izoh:</b><br>
                  ${order.note}
                </div>
              `
              : ""
          }


          <div class="total-row">

            <span>Jami</span>

            <span>
              ${money(order.total)}
            </span>

          </div>


          <div class="actions">

            ${
              status === "new"
                ? `
                  <button
                    class="action"
                    onclick="changeStatus(${order.id}, 'preparing')"
                  >
                    👨‍🍳 Tayyorlashni boshlash
                  </button>
                `
                : ""
            }


            ${
              status === "preparing"
                ? `
                  <button
                    class="action"
                    onclick="changeStatus(${order.id}, 'ready')"
                  >
                    ✅ Tayyor
                  </button>
                `
                : ""
            }


            ${
              status === "ready"
                ? `
                  <button
                    class="action"
                    onclick="changeStatus(${order.id}, 'courier')"
                  >
                    🛵 Kuryerga berildi
                  </button>
                `
                : ""
            }


            ${
              status === "courier"
                ? `
                  <button
                    class="action"
                    onclick="changeStatus(${order.id}, 'delivered')"
                  >
                    📦 Yetkazildi
                  </button>
                `
                : ""
            }


            ${
              status !== "delivered" &&
              status !== "cancelled"
                ? `
                  <button
                    class="action"
                    onclick="changeStatus(${order.id}, 'cancelled')"
                  >
                    ❌ Bekor qilish
                  </button>
                `
                : ""
            }

          </div>

        </div>

      `;

    }).join("");

}


async function changeStatus(orderId, newStatus) {

  const order =
    orders.find(x =>
      x.id === orderId
    );

  if (!order) return;


  const confirmText =

    newStatus === "cancelled"

      ? "Buyurtmani bekor qilasizmi?"

      : `Statusni "${statusNames[newStatus]}" ga o‘zgartirasizmi?`;


  if (!confirm(confirmText)) {
    return;
  }


  try {

    const response = await fetch(

      `${SUPABASE_URL}/rest/v1/orders?id=eq.${orderId}`,

      {

        method: "PATCH",

        headers: {

          apikey: SUPABASE_KEY,

          Authorization:
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json",

          Prefer:
            "return=minimal"

        },

        body: JSON.stringify({

          status: newStatus

        })

      }

    );


    if (!response.ok) {

      const error =
        await response.text();

      alert(
        "Statusni o‘zgartirishda xatolik:\n\n"
        + error
      );

      return;
    }


    order.status =
      newStatus;


    updateStats();

    renderOrders();


  } catch (error) {

    console.error(error);

    alert(
      "Server bilan bog‘lanishda xatolik."
    );

  }

}


loadOrders();


setInterval(() => {

  loadOrders();

}, 15000);

</script>

</body>
</html>
