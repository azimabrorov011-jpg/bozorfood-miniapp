<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>RastaGo Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827
}
header{
  background:#111827;
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:20
}
.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}
.logo{
  font-size:22px;
  font-weight:bold
}
.header-right{
  display:flex;
  gap:8px
}
button{
  border:0;
  cursor:pointer;
  font-weight:bold
}
.refresh,.sound{
  padding:10px 13px;
  border-radius:9px;
  background:white;
  color:#111827
}
.container{
  max-width:1100px;
  margin:auto;
  padding:16px
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px
}
.stat{
  background:white;
  padding:15px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.06)
}
.stat-title{
  color:#6b7280;
  font-size:13px
}
.stat-value{
  font-size:25px;
  font-weight:bold;
  margin-top:5px
}
.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:12px
}
.filter{
  white-space:nowrap;
  padding:10px 13px;
  border-radius:9px;
  background:white
}
.filter.active{
  background:#111827;
  color:white
}
.new-alert{
  display:none;
  background:#dc2626;
  color:white;
  padding:13px;
  border-radius:12px;
  margin-bottom:14px;
  text-align:center;
  font-weight:bold;
  animation:pulse 1s infinite
}
@keyframes pulse{
  50%{opacity:.55}
}
.order{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:13px;
  box-shadow:0 3px 12px rgba(0,0,0,.07)
}
.order.new{
  border:2px solid #dc2626
}
.top{
  display:flex;
  justify-content:space-between;
  gap:10px
}
.number{
  font-size:21px;
  font-weight:bold
}
.time{
  color:#6b7280;
  font-size:12px;
  margin-top:4px
}
.badge{
  height:max-content;
  padding:7px 10px;
  border-radius:9px;
  background:#eef2f7;
  font-size:12px;
  font-weight:bold
}
.customer{
  margin-top:13px;
  background:#f8fafc;
  padding:12px;
  border-radius:11px;
  line-height:1.8
}
.items{
  margin-top:13px;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  padding:10px 0
}
.item{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  gap:10px
}
.note{
  margin-top:12px;
  background:#fff7ed;
  color:#9a3412;
  padding:11px;
  border-radius:10px
}
.total{
  display:flex;
  justify-content:space-between;
  margin-top:13px;
  font-size:18px;
  font-weight:bold
}
.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:14px
}
.action{
  padding:12px;
  border-radius:10px;
  background:#eef2f7
}
.action:hover{
  opacity:.8
}
.empty,.loading{
  text-align:center;
  padding:45px 15px;
  color:#6b7280
}
.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  display:none;
  z-index:50;
  box-shadow:0 5px 20px rgba(0,0,0,.25)
}
@media(max-width:650px){
  .stats{
    grid-template-columns:repeat(2,1fr)
  }
  .top{
    flex-direction:column
  }
  .actions{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">
      🍽 RastaGo Admin
    </div>

    <div class="header-right">
      <button class="sound" onclick="enableSound()">
        🔔 Ovoz
      </button>

      <button class="refresh" onclick="manualRefresh()">
        🔄
      </button>
    </div>

  </div>
</header>

<div class="container">

  <div id="newAlert" class="new-alert">
    🔔 YANGI BUYURTMA KELDI!
  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">Bugun</div>
      <div id="todayCount" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Yangi</div>
      <div id="newCount" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Tayyorlanmoqda</div>
      <div id="cookingCount" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Bugungi savdo</div>
      <div id="revenue" class="stat-value">0</div>
    </div>

  </div>

  <div class="filters">

    <button class="filter active"
      onclick="setFilter('all',this)">
      Barchasi
    </button>

    <button class="filter"
      onclick="setFilter('new',this)">
      🆕 Yangi
    </button>

    <button class="filter"
      onclick="setFilter('preparing',this)">
      👨‍🍳 Tayyorlanmoqda
    </button>

    <button class="filter"
      onclick="setFilter('ready',this)">
      ✅ Tayyor
    </button>

    <button class="filter"
      onclick="setFilter('courier',this)">
      🛵 Kuryerda
    </button>

    <button class="filter"
      onclick="setFilter('delivered',this)">
      📦 Yetkazildi
    </button>

    <button class="filter"
      onclick="setFilter('cancelled',this)">
      ❌ Bekor
    </button>

  </div>

  <div id="orders" class="loading">
    Buyurtmalar yuklanmoqda...
  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL =
"https://uqgckzrmibdgxkxdfzav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KBodwmECQvN46zDKjOwfhg_fet6nBiy";

let orders=[];
let filter="all";
let firstLoad=true;
let knownIds=new Set();
let soundEnabled=false;

const statusNames={
  new:"🆕 Yangi",
  preparing:"👨‍🍳 Tayyorlanmoqda",
  ready:"✅ Tayyor",
  courier:"🛵 Kuryerda",
  delivered:"📦 Yetkazildi",
  cancelled:"❌ Bekor qilingan"
};

function money(n){
  return Number(n||0).toLocaleString("uz-UZ")+" so'm";
}

function dateText(v){
  if(!v)return "-";

  return new Date(v).toLocaleString("uz-UZ",{
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function enableSound(){

  soundEnabled=true;

  showToast("🔔 Ovozli bildirishnoma yoqildi");

  try{
    const ctx=new AudioContext();
    ctx.resume();
  }catch(e){}

}

function playSound(){

  if(!soundEnabled)return;

  try{

    const ctx=new AudioContext();

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value=880;
    gain.gain.value=.25;

    osc.start();

    setTimeout(()=>{
      osc.stop();
      ctx.close();
    },500);

  }catch(e){}

}

function showToast(text){

  const el=document.getElementById("toast");

  el.textContent=text;
  el.style.display="block";

  setTimeout(()=>{
    el.style.display="none";
  },3000);

}

async function loadOrders(){

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/orders?select=*&order=created_at.desc",
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer "+SUPABASE_KEY
        }
      }
    );

    if(!response.ok){

      const error=await response.text();

      document.getElementById("orders").innerHTML=
        `<div class="empty">Xatolik: ${error}</div>`;

      return;

    }

    const data=await response.json();

    const currentIds=new Set(
      data.map(x=>String(x.id))
    );

    let newOrders=[];

    if(!firstLoad){

      newOrders=data.filter(order=>
        !knownIds.has(String(order.id))
      );

    }

    orders=data;

    knownIds=currentIds;

    updateStats();

    renderOrders();

    if(newOrders.length){

      document.getElementById("newAlert")
        .style.display="block";

      playSound();

      showToast(
        "🔔 Yangi buyurtma: "+
        (newOrders[0].order_number||"ORD")
      );

      setTimeout(()=>{
        document.getElementById("newAlert")
          .style.display="none";
      },10000);

    }

    firstLoad=false;

  }catch(error){

    console.error(error);

    document.getElementById("orders").innerHTML=
      `<div class="empty">
        Server bilan bog‘lanishda xatolik.
      </div>`;

  }

}

function updateStats(){

  const today=new Date()
    .toISOString()
    .slice(0,10);

  const todayOrders=orders.filter(x=>
    String(x.created_at||"").startsWith(today)
  );

  const newOrders=orders.filter(x=>
    x.status==="new"
  );

  const cooking=orders.filter(x=>
    x.status==="preparing"
  );

  const revenue=todayOrders
    .filter(x=>x.status!=="cancelled")
    .reduce(
      (sum,x)=>sum+Number(x.total||0),
      0
    );

  document.getElementById("todayCount")
    .textContent=todayOrders.length;

  document.getElementById("newCount")
    .textContent=newOrders.length;

  document.getElementById("cookingCount")
    .textContent=cooking.length;

  document.getElementById("revenue")
    .textContent=money(revenue);

}

function setFilter(value,button){

  filter=value;

  document.querySelectorAll(".filter")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  renderOrders();

}

function renderOrders(){

  const box=document.getElementById("orders");

  let list=orders;

  if(filter!=="all"){

    list=orders.filter(x=>
      x.status===filter
    );

  }

  if(!list.length){

    box.innerHTML=
      `<div class="empty">
        Hozircha buyurtmalar yo‘q.
      </div>`;

    return;

  }

  box.innerHTML=list.map(order=>{

    const items=
      Array.isArray(order.items)
      ?order.items
      :[];

    const itemsHtml=items.map(item=>{

      const qty=
        Number(item.quantity||item.qty||0);

      const price=
        Number(item.price||0);

      return `
        <div class="item">
          <span>
            ${item.name||"Mahsulot"} × ${qty}
          </span>

          <span>
            ${money(price*qty)}
          </span>
        </div>
      `;

    }).join("");

    const status=
      order.status||"new";

    return `

      <div class="order ${status==="new"?"new":""}">

        <div class="top">

          <div>

            <div class="number">
              ${order.order_number||"ORD"}
            </div>

            <div class="time">
              🕐 ${dateText(order.created_at)}
            </div>

          </div>

          <div class="badge">
            ${statusNames[status]||status}
          </div>

        </div>

        <div class="customer">

          🏪 <b>Do‘kon:</b>
          ${order.shop_code||"-"}

          <br>

          👤 <b>Mijoz:</b>
          ${order.customer_name||"-"}

          <br>

          📞 <b>Telefon:</b>
          ${order.phone||"-"}

        </div>

        <div class="items">

          ${itemsHtml||"Mahsulot yo‘q"}

        </div>

        ${
          order.note
          ?`
            <div class="note">
              📝 <b>Izoh:</b><br>
              ${order.note}
            </div>
          `
          :""
        }

        <div class="total">

          <span>Jami</span>

          <span>
            ${money(order.total)}
          </span>

        </div>

        <div class="actions">

          ${
            status==="new"
            ?`
              <button class="action"
                onclick="changeStatus(${order.id},'preparing')">
                👨‍🍳 Tayyorlashni boshlash
              </button>
            `
            :""
          }

          ${
            status==="preparing"
            ?`
              <button class="action"
                onclick="changeStatus(${order.id},'ready')">
                ✅ Tayyor
              </button>
            `
            :""
          }

          ${
            status==="ready"
            ?`
              <button class="action"
                onclick="changeStatus(${order.id},'courier')">
                🛵 Kuryerga berish
              </button>
            `
            :""
          }

          ${
            status==="courier"
            ?`
              <button class="action"
                onclick="changeStatus(${order.id},'delivered')">
                📦 Yetkazildi
              </button>
            `
            :""
          }

          ${
            status!=="delivered" &&
            status!=="cancelled"
            ?`
              <button class="action"
                onclick="changeStatus(${order.id},'cancelled')">
                ❌ Bekor qilish
              </button>
            `
            :""
          }

        </div>

      </div>

    `;

  }).join("");

}

async function changeStatus(id,newStatus){

  const order=orders.find(x=>x.id===id);

  if(!order)return;

  const text=
    newStatus==="cancelled"
    ?"Buyurtmani bekor qilasizmi?"
    :"Statusni "+statusNames[newStatus]+" ga o‘zgartirasizmi?";

  if(!confirm(text))return;

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/orders?id=eq."+id,
      {
        method:"PATCH",

        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json",
          Prefer:"return=minimal"
        },

        body:JSON.stringify({
          status:newStatus
        })
      }
    );

    if(!response.ok){

      const error=await response.text();

      alert(
        "Statusni o‘zgartirishda xatolik:\n\n"+
        error
      );

      return;

    }

    order.status=newStatus;

    updateStats();
    renderOrders();

    showToast(
      "✅ "+(order.order_number||"Buyurtma")+
      " yangilandi"
    );

  }catch(error){

    alert(
      "Server bilan bog‘lanishda xatolik."
    );

  }

}

async function manualRefresh(){

  await loadOrders();

  showToast("🔄 Yangilandi");

}

loadOrders();

setInterval(()=>{

  loadOrders();

},15000);

</script>

</body>
</html>
